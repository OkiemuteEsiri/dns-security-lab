name: defensive-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Synthetic assessment smoke test
        run: |
          python -m src.cli data/synthetic_dns_inventory.json --output /tmp/dns-assessment.md
          test -s /tmp/dns-assessment.md
          grep -q "DNS Security Assessment Report" /tmp/dns-assessment.md
